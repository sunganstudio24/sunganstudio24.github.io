  <main class="flex-grow w-full">

    </div>
    <div class="max-w-6xl mx-auto px-6 py-12 w-full">
      <div id="typeTabs" class="flex flex-nowrap md:flex-wrap justify-start md:justify-center gap-2 overflow-x-auto no-scrollbar mb-12"></div>
      <div id="projectGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8"></div>
      <div class="text-center mt-20 text-sm text-muted space-x-6">

  <!-- 프로젝트 상세 -->
  <div id="projectModal" class="fixed inset-0 z-40 bg-bg overflow-y-auto" style="display:none">
    <div class="max-w-6xl mx-auto px-6 pt-28 pb-16">
      <div class="flex justify-end"><button id="closeProjectBtn" class="p-2 text-muted hover:text-ink" aria-label="닫기"><i data-lucide="x" class="w-7 h-7"></i></button></div>
      <p id="pmClient" class="text-xs font-semibold tracking-[0.2em] text-gold mb-2"></p>
      <h2 id="pmTitle" class="text-2xl md:text-4xl font-extrabold text-ink mb-3" style="word-break:keep-all"></h2>
      <div id="pmMeta" class="flex flex-wrap gap-2 mb-10"></div>
      <div id="pmVideos" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10"></div>
      <div id="pmPhotos" class="columns-2 md:columns-3 gap-4 [&>*]:mb-4"></div>
    </div>
  </div>

  <!-- 사진 크게 보기 -->
  <div id="photoViewer" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4" style="display:none">
    <img id="photoViewerImg" class="max-w-full max-h-full object-contain" alt="">
  </div>

  <div id="theater" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm flex flex-col justify-between items-center p-3 md:p-6" style="display: none;">
    <div class="w-full flex justify-between items-center text-white/80 text-[10px] uppercase">
      <span>Cinema Theater</span>
      <button id="closeTheaterBtn" class="text-white/60 hover:text-white p-2 focus:outline-none"><i data-lucide="x" class="w-6 h-6"></i></button>
    </div>
    <div id="theaterFrame" class="w-full max-w-4xl aspect-video rounded-lg overflow-hidden bg-black shadow-2xl">
      <iframe id="theaterIframe" src="" class="w-full h-full border-0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <div class="text-center text-white pb-6">
      <h4 id="theaterTitle" class="text-lg font-light tracking-wide"></h4>
    </div>
  </div>

  <footer class="bg-footerbg border-t border-white/5 py-10">

      <p class="mt-2">

        <a href="https://instagram.com/sungan__studio" target="_blank" rel="noopener noreferrer" class="hover:text-goldlight transition-colors">@sungan__studio</a>
      </p>
    </div>
  </footer>

  <a id="floatingMailBtn" href="mailto:dj7013@naver.com" aria-label="이메일 문의"
     class="floating-mail-btn fixed bottom-5 right-5 md:bottom-8 md:right-8 z-[9999] w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center opacity-0 pointer-events-none">
    <i data-lucide="mail" class="w-5 h-5 md:w-6 md:h-6"></i>
  </a>

  <script src="assets/theme.js?v=20260825"></script>
  <script>
    Theme.initHeader(); Theme.initMobileMenu(); Theme.initImageProtection(); Theme.initFloatingButton();
    const yt = (id) => `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
    let projects = [], types = {}, active = 'all';

    Promise.all([
      fetch('data/projects.json?v=' + Date.now()).then(r => r.json()),
      fetch('images.json?v=' + Date.now()).then(r => r.json()),
      fetch('videos.json?v=' + Date.now()).then(r => r.json())
    ]).then(([pj, images, videos]) => {
      types = pj.types;
      const vmap = new Map(videos.map(v => [v.youtubeId, v]));
      projects = pj.projects.map(p => ({
        ...p,
        photos: images.filter(i => (p.photoTitles || []).some(t => (i.title || '').startsWith(t))),
        vids: (p.videos || []).map(id => vmap.get(id) || { youtubeId: id, title: p.title })
      }));
      // 정렬: 영상+사진 → 영상 → 사진, 같은 그룹 안에서는 대표작(featured) 먼저, 그다음 projects.json 순서
      const tier = p => (p.photos.length && p.vids.length) ? 0 : (p.vids.length ? 1 : 2);
      projects = projects.map((p, i) => ({ p, i }))
        .sort((a, b) => tier(a.p) - tier(b.p) || (b.p.featured ? 1 : 0) - (a.p.featured ? 1 : 0) || a.i - b.i)
        .map(x => x.p);
      renderTabs(); renderGrid();
      const hash = decodeURIComponent(location.hash.slice(1));
      const hit = projects.find(p => p.id === hash);
      if (hit) openProject(hit);
    });

    function renderTabs() {
      const box = document.getElementById('typeTabs');
      box.innerHTML = '';
      [['all', '전체'], ...Object.entries(types)].forEach(([k, label]) => {
        const n = k === 'all' ? projects.length : projects.filter(p => p.types.includes(k)).length;
        if (!n) return;
        const b = document.createElement('button');
        b.className = 'tag-filter-btn shrink-0 px-4 py-2 text-xs rounded-full transition-colors duration-300' + (active === k ? ' is-active' : '');
        b.textContent = `${label} ${n}`;
        b.onclick = () => { active = k; renderTabs(); renderGrid(); };
        box.appendChild(b);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('projectGrid');
      grid.innerHTML = '';
      projects.filter(p => active === 'all' || p.types.includes(active)).forEach(p => {
        const a = document.createElement('button');
        a.className = 'group text-left';
        const cover = p.photos[0] ? p.photos[0].file : yt(p.vids[0].youtubeId);
        const badge = [p.photos.length ? `사진 ${p.photos.length}` : '', p.vids.length ? `영상 ${p.vids.length}` : ''].filter(Boolean).join(' · ');
        a.innerHTML = `
          <div class="relative aspect-[4/3] overflow-hidden rounded-xl bg-tint">
            <img src="${cover}" alt="" loading="lazy" draggable="false" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-[1.04]">
            ${p.vids.length ? '<span class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/60 flex items-center justify-center"><i data-lucide="play" class="w-4 h-4 text-white"></i></span>' : ''}
          </div>
          <p class="mt-4 text-xs font-semibold text-gold tracking-wide">${p.client}</p>
          <h3 class="mt-1 text-base md:text-lg font-bold text-ink" style="word-break:keep-all">${p.title}</h3>
          <p class="mt-1 text-xs text-muted">${p.types.map(t => types[t]).join(' · ')} — ${badge}</p>`;
        a.onclick = () => openProject(p);
        grid.appendChild(a);
      });
      lucide.createIcons();
    }

    function openProject(p) {
      document.getElementById('pmClient').textContent = p.client;
      document.getElementById('pmTitle').textContent = p.title;
      document.getElementById('pmMeta').innerHTML = p.types.map(t => `<span class="px-3 py-1 text-xs rounded-full border border-border text-muted">${types[t]}</span>`).join('');
      const vbox = document.getElementById('pmVideos');
      vbox.innerHTML = '';
      p.vids.forEach(v => {
        const b = document.createElement('button');
        b.className = 'group text-left';
        b.innerHTML = `<div class="relative ${v.vertical ? 'aspect-[9/16] max-h-[520px] mx-auto' : 'aspect-video'} overflow-hidden rounded-xl bg-black">
            <img src="${yt(v.youtubeId)}" class="w-full h-full object-cover opacity-90 group-hover:opacity-100" alt="">
            <span class="absolute inset-0 flex items-center justify-center"><span class="w-14 h-14 rounded-full bg-white/90 flex items-center justify-center"><i data-lucide="play" class="w-6 h-6 text-ink"></i></span></span>
          </div><p class="mt-2 text-sm text-ink">${v.title || ''}</p>`;
        b.onclick = () => openTheater(v);
        vbox.appendChild(b);
      });
      const pbox = document.getElementById('pmPhotos');
      pbox.innerHTML = '';
      p.photos.forEach(ph => {
        const img = document.createElement('img');
        img.src = ph.file; img.loading = 'lazy'; img.draggable = false;
        img.className = 'w-full rounded-lg cursor-zoom-in break-inside-avoid';
        img.onclick = () => { document.getElementById('photoViewerImg').src = ph.file; document.getElementById('photoViewer').style.display = 'flex'; };
        pbox.appendChild(img);
      });
      document.getElementById('projectModal').style.display = 'block';
      document.getElementById('projectModal').scrollTop = 0;
      document.body.style.overflow = 'hidden';
      if (location.hash !== '#' + p.id) history.pushState({ project: p.id }, '', '#' + p.id);
      lucide.createIcons();
    }

    function hideProject() {
      document.getElementById('projectModal').style.display = 'none';
      document.body.style.overflow = '';
    }
    // 닫기 = 브라우저 뒤로가기와 동일하게 처리 (목록으로 복귀)
    function closeProject() {
      if (history.state && history.state.project) history.back();
      else { hideProject(); history.replaceState(null, '', location.pathname); }
    }
    window.addEventListener('popstate', () => {
      const id = decodeURIComponent(location.hash.slice(1));
      const hit = projects.find(p => p.id === id);
      if (hit) openProject(hit); else hideProject();
    });
    document.getElementById('closeProjectBtn').onclick = closeProject;
    document.getElementById('photoViewer').onclick = (e) => { e.currentTarget.style.display = 'none'; };

    function openTheater(v) {
      document.getElementById('theaterIframe').src = `https://www.youtube.com/embed/${v.youtubeId}?autoplay=1&rel=0`;
      document.getElementById('theaterTitle').textContent = v.title || '';
      document.getElementById('theater').style.display = 'flex';
    }
    document.getElementById('closeTheaterBtn').onclick = () => {
      document.getElementById('theaterIframe').src = '';
      document.getElementById('theater').style.display = 'none';
    };
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (document.getElementById('theater').style.display === 'flex') document.getElementById('closeTheaterBtn').click();
      else if (document.getElementById('photoViewer').style.display === 'flex') document.getElementById('photoViewer').style.display = 'none';
      else closeProject();
    });
    lucide.createIcons();
  </script>
</body>
